[package]
name = "supermail_android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
supermail_core = { path = "../supermail-core", default-features = false }
jni = "0.21"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
