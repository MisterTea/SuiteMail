[package]
name = "supermail_ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[target.'cfg(target_os = "ios")'.dependencies]
supermail_core = { path = "../supermail-core", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
