[package]
name = "supermail_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node", "graph"]
graph = ["dep:io-msgraph"]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "2.16", optional = true, default-features = false, features = ["async", "tokio_rt", "serde-json"] }
napi-derive = { version = "2.16", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt", "time"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
utf7-imap = "0.3"
socket2 = "0.5"
rusqlite = { version = "0.41", features = ["bundled"] }
quick-xml = "0.41"
io-msgraph = { version = "0.9.3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }
