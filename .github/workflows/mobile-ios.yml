name: Mobile - iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Initialize iOS if needed
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init --ci
          fi

      - name: Build iOS App (Release, unsigned)
        if: inputs.build_type == 'release'
        run: npx tauri ios build --no-sign --ci

      - name: Build iOS App (Debug, unsigned)
        if: inputs.build_type == 'debug'
        run: npx tauri ios build --debug --no-sign --ci

      - name: Package iOS build outputs
        run: |
          mkdir -p ios-artifacts
          if [ -d "src-tauri/gen/apple/build" ]; then
            tar -czf ios-artifacts/suitemail-ios-build.tar.gz -C src-tauri/gen/apple build
          else
            tar -czf ios-artifacts/suitemail-ios-project.tar.gz -C src-tauri/gen apple
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suitemail-ios
          path: ios-artifacts/*.tar.gz
          if-no-files-found: error
