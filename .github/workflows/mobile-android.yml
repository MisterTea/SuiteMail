name: Mobile - Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" || true
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          else
            ANDROID_NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (Release)
        if: inputs.build_type == 'release'
        run: npx tauri android build --apk

      - name: Build Android APK (Debug)
        if: inputs.build_type == 'debug'
        run: npx tauri android build --apk --debug

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermail-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
