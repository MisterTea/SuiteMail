name: Publish recovered SuiteMail 0.1.6
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45410018148
          pattern: SuiteMail-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45413176774
          name: SuiteMail-macos-arm64
          path: release-assets
      - name: Verify and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v0.1.6
          sha=fd1252ed9a338da1a8d92a011c411165932e2270
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)"
          test "$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq .object.sha)" = "$sha"
          test "$(gh api "repos/$GH_REPO/actions/runs/45410018148" --jq .head_sha)" = "$sha"
          test "$(gh api "repos/$GH_REPO/actions/runs/45413176774" --jq .head_sha)" = 89d06fc6f30d583b6ed4081386bdb411e7fb9f29
          release_id="$(gh api "repos/$GH_REPO/releases?per_page=20" --jq '.[] | select(.tag_name == "v0.1.6" and .draft) | .id')"
          test -n "$release_id"
          assets_endpoint="repos/$GH_REPO/releases/$release_id/assets?per_page=100"

          files=(release-assets/*)
          test "${#files[@]}" -eq 16
          for name in \
              latest-linux.yml \
              SuiteMail-0.1.6-android.apk SuiteMail-0.1.6-android-source.tar.gz \
              SuiteMail-0.1.6-linux-amd64.deb SuiteMail-0.1.6-linux-x86_64.AppImage \
              SuiteMail-0.1.6-mac-arm64.dmg SuiteMail-0.1.6-mac-arm64.dmg.blockmap \
              SuiteMail-0.1.6-mac-arm64.zip SuiteMail-0.1.6-mac-arm64.zip.blockmap \
              SuiteMail-0.1.6-mac-x64.dmg SuiteMail-0.1.6-mac-x64.dmg.blockmap \
              SuiteMail-0.1.6-mac-x64.zip SuiteMail-0.1.6-mac-x64.zip.blockmap \
              SuiteMail-0.1.6-windows-x64-portable.exe SuiteMail-0.1.6-windows-x64-setup.exe \
              SuiteMail-0.1.6-windows-x64-setup.exe.blockmap; do
            test -s "release-assets/$name"
          done

          manifest="$(mktemp)"
          sha256sum "${files[@]}" > "$manifest"
          uploaded="$(gh api "$assets_endpoint")"
          missing=()
          while read -r digest file; do
            if ! jq -e --arg name "${file##*/}" --arg digest "sha256:$digest" \
                'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)' <<< "$uploaded" > /dev/null; then
              missing+=("$file")
            fi
          done < "$manifest"
          if (( ${#missing[@]} )); then
            gh release upload "$tag" --clobber "${missing[@]}"
          fi

          uploaded="$(gh api "$assets_endpoint")"
          test "$(jq length <<< "$uploaded")" -eq "${#files[@]}"
          while read -r digest file; do
            jq -e --arg name "${file##*/}" --arg digest "sha256:$digest" \
                'any(.[]; .name == $name and .state == "uploaded" and .digest == $digest)' <<< "$uploaded" > /dev/null
          done < "$manifest"
          gh release edit "$tag" --draft=false --latest
