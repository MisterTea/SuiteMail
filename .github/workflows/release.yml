name: Build & Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag (e.g. suitemail-v0.4.3)"
        type: string
        required: false
      release_id:
        description: "Existing GitHub release ID to upload assets to"
        type: string
        required: false
  workflow_dispatch:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--linux"
          - platform: windows-latest
            args: "--win"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build Rust core addon
        run: npm run build:rust:release

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload to release
        if: inputs.tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" dist-electron/* --clobber || true

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Build Rust core addon
        run: npm run build:rust:release

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --mac

      - name: Upload to release
        if: inputs.tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" dist-electron/* --clobber || true
