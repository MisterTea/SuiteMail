name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            args: --mac --arm64
          - platform: macos-x64
            os: macos-15-intel
            args: --mac --x64
          - platform: windows-x64
            os: windows-latest
            args: --win --x64
          - platform: linux-x64
            os: ubuntu-22.04
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Keep the stock Electron distribution intact for electron-builder.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Electron
        run: node node_modules/electron/install.js
      - name: Build native backend
        run: npx napi build --platform --release --manifest-path crates/supermail-core/Cargo.toml --output-dir crates/supermail-core
      - name: Verify native backend
        run: node --input-type=module -e "import { loadSupermailCore } from './electron/loadAddon.js'; const core = loadSupermailCore(); if (typeof core.invoke !== 'function') throw new Error('Native backend missing');"
      - name: Build interface
        run: npm run build
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SuiteMail-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "SuiteMail ${RELEASE_TAG#v}" --notes "SuiteMail ${RELEASE_TAG#v} for macOS (Apple Silicon and Intel), Windows x64, and Linux x64. Installers built by GitHub Actions. These builds are not signed with platform developer certificates or notarized."
