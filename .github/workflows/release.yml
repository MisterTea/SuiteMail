name: Apple Silicon release fallback
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos-arm64:
    name: Cross-build Apple Silicon on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.4
      - name: Verify release source
        run: test "$(git rev-parse HEAD)" = 9265527ea3708fe0f60b76bd690058e96f754358
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64-cross
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Build native module for Apple Silicon
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          npx napi build --platform --release --target aarch64-apple-darwin --manifest-path crates/supermail-core/Cargo.toml --output-dir crates/supermail-core
          test "$(lipo -archs crates/supermail-core/index.darwin-arm64.node)" = arm64
      - run: npm run build
      - name: Package installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --arm64 --publish never
      - name: Verify packaged architectures
        run: |
          app="$(find dist-electron -type d -name SuiteMail.app -print -quit)"
          launcher="$app/Contents/MacOS/SuiteMail"
          addon="$app/Contents/Resources/app.asar.unpacked/crates/supermail-core/index.darwin-arm64.node"
          test "$(lipo -archs "$launcher")" = arm64
          test "$(lipo -archs "$addon")" = arm64
          test -s dist-electron/SuiteMail-0.1.4-mac-arm64.dmg
          test -s dist-electron/SuiteMail-0.1.4-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuiteMail-macos-arm64
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
