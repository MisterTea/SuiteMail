<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy — SuiteMail</title>
    <meta
      name="description"
      content="SuiteMail Privacy Policy: local-first SQLite storage, zero SuiteMail cloud servers, direct mail-server metadata sync, and on-device local AI."
    />
    <meta name="theme-color" content="#faf8f4" />
    <script>
      ;(function () {
        var t = localStorage.getItem('suitemail-theme')
        var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#0e1113')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-privacy.tsx"></script>
  </body>
</html>
