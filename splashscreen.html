<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuiteMail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0c1813 0%, #12291e 40%, #1b3d2f 70%, #0d1a15 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-name {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f2f7ed;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 24px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #a6cba5;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="brand-container">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="g" x2="1" y2="1">
          <stop stop-color="#357e60"/>
          <stop offset="1" stop-color="#1b523e"/>
        </linearGradient>
      </defs>
      <rect x="32" y="32" width="960" height="960" rx="215" fill="url(#g)"/>
      <rect x="180" y="320" width="664" height="440" rx="52" fill="#f2f7ed"/>
      <path d="M180 330 C300 350 420 440 512 560 C604 440 724 350 844 330" fill="none" stroke="#235c46" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M512 560 L512 760" fill="none" stroke="#235c46" stroke-width="36" stroke-linecap="round"/>
      <path d="M512 450 L410 390 M512 450 L614 390" fill="none" stroke="#a6cba5" stroke-width="26" stroke-linecap="round"/>
      <path d="M512 650 L400 580 M512 650 L624 580" fill="none" stroke="#a6cba5" stroke-width="26" stroke-linecap="round"/>
    </svg>
    <div class="brand-name">SuiteMail</div>
  </div>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
